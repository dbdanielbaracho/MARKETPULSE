name: Production browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-browser-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Allow production deployment to settle
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Test real PrediBeacon production
        env:
          PREDIBEACON_PRODUCTION_SMOKE: '1'
          PREDIBEACON_CUSTOM_URL: 'https://predibeacon.com'
          PREDIBEACON_RAILWAY_URL: 'https://marketpulse-production-aa9f.up.railway.app'
        run: |
          pytest -q browser_e2e/test_production_smoke.py
          pytest -q browser_e2e/test_production_mobile.py
