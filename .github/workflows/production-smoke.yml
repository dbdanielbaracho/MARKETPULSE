name: Production browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-browser-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Allow production deployment to settle
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Test real PrediBeacon production
        id: production_smoke
        continue-on-error: true
        env:
          PREDIBEACON_PRODUCTION_SMOKE: '1'
          PREDIBEACON_CUSTOM_URL: 'https://predibeacon.com'
          PREDIBEACON_RAILWAY_URL: 'https://marketpulse-production-aa9f.up.railway.app'
        run: |
          pytest -q browser_e2e/test_production_smoke.py
          pytest -q browser_e2e/test_production_mobile.py
          pytest -q browser_e2e/test_production_outbound.py
      - name: Publish production smoke commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            target_sha="${WORKFLOW_HEAD_SHA}"
          else
            target_sha="${GITHUB_SHA}"
          fi
          if [[ -z "${target_sha}" ]]; then
            echo "Unable to resolve tested commit SHA"
            exit 1
          fi
          state="failure"
          description="Production browser smoke failed"
          if [[ "${SMOKE_OUTCOME}" == "success" ]]; then
            state="success"
            description="Production browser smoke passed"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            -f state="${state}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="${description}" \
            -f context="predibeacon/production-browser-smoke"
          if [[ "${state}" != "success" ]]; then
            exit 1
          fi
