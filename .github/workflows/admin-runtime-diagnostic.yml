name: Admin runtime diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'app/services/admin_session.py'
      - 'app/routes/admin_portal.py'
      - '.github/workflows/admin-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production-admin-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Allow Railway deployment to settle
        run: sleep 90
      - name: Check custom domain and Railway runtime configuration
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          urls = [
              'https://predibeacon.com/api/v1/admin/session',
              'https://marketpulse-production-aa9f.up.railway.app/api/v1/admin/session',
          ]
          results = {}
          for url in urls:
              last = None
              for _ in range(20):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'PrediBeacon-admin-runtime-diagnostic/1.0'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          data = json.load(response)
                      results[url] = data
                      break
                  except Exception as exc:
                      last = exc
                      time.sleep(10)
              else:
                  raise SystemExit(f'Unable to read {url}: {last}')
          for url, data in results.items():
              cfg = data.get('configuration', {})
              safe = {
                  'email': data.get('email'),
                  'two_factor_enabled': data.get('two_factor_enabled'),
                  'password_configured': cfg.get('password_configured'),
                  'password_valid_length': cfg.get('password_valid_length'),
                  'session_signing_configured': cfg.get('session_signing_configured'),
              }
              print(url, json.dumps(safe, sort_keys=True))
          custom = results[urls[0]].get('configuration', {})
          if not custom.get('password_configured'):
              raise SystemExit('predibeacon.com runtime has not loaded MP_ADMIN_PASSWORD')
          if not custom.get('password_valid_length'):
              raise SystemExit('predibeacon.com runtime reports an invalid admin password length')
          if not custom.get('session_signing_configured'):
              raise SystemExit('predibeacon.com runtime cannot sign admin sessions')
          if results[urls[0]].get('two_factor_enabled'):
              raise SystemExit('predibeacon.com unexpectedly has admin 2FA enabled')
          PY
