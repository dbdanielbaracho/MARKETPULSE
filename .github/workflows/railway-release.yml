name: Deploy PrediBeacon to Railway

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: predibeacon-railway-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RAILWAY_SERVICE: marketpulse
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Require Railway project token
        run: |
          if [[ -z "${RAILWAY_TOKEN}" ]]; then
            echo "RAILWAY_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest

      - name: Verify Railway target
        run: railway service status --service "${RAILWAY_SERVICE}" --json

      - name: Stamp exact source SHA into CLI upload
        run: |
          printf '%s\n' "${SOURCE_SHA}" > app/.deployment_sha
          test "$(cat app/.deployment_sha)" = "${SOURCE_SHA}"

      - name: Deploy exact checked-out source to Railway
        run: railway up --ci --service "${RAILWAY_SERVICE}"

      - name: Install production audit dependencies
        run: pip install -r requirements.txt

      - name: Prove production is serving this exact SHA
        run: >-
          python -m scripts.production_audit
          --base-url https://predibeacon.com
          --expected-sha "${SOURCE_SHA}"
          --deploy-timeout 600
          --market-limit 50
          --require-live-data

      - name: Publish production release commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="failure"
          description="Railway production release failed"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state="success"
            description="Railway production release passed"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state="${state}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="${description}" \
            -f context="predibeacon/railway-production-release"
          if [[ "${state}" != "success" ]]; then
            exit 1
          fi
