name: Final project acceptance

on:
  push:
    branches: [main]
    paths:
      - 'docs/REQUIREMENTS.md'
      - '.github/workflows/final-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: predibeacon-final-acceptance
  cancel-in-progress: false

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREDIBEACON_PRODUCTION_SMOKE: '1'
      PREDIBEACON_CUSTOM_URL: 'https://predibeacon.com'
      PREDIBEACON_RAILWAY_URL: 'https://marketpulse-production-aa9f.up.railway.app'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium

      - name: Require all pre-closure requirements to be terminal
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('docs/REQUIREMENTS.md').read_text(encoding='utf-8')
          rows = re.findall(r'^\| (MP-\d+) \|.*?\| ([A-Z_]+) \|', text, re.MULTILINE)
          allowed = {'VERIFIED', 'BLOCKED', 'REPLACED_WITH_EVIDENCE', 'REMOVED_WITH_RATIONALE'}
          bad = [(requirement, status) for requirement, status in rows if requirement != 'MP-063' and status not in allowed]
          mp63 = next((status for requirement, status in rows if requirement == 'MP-063'), None)
          if bad:
              raise SystemExit(f'Non-terminal pre-closure requirements: {bad}')
          if mp63 not in {'REQUIRED', 'VERIFIED'}:
              raise SystemExit(f'Unexpected MP-063 state: {mp63}')
          print(f'Pre-closure registry terminal: {len(rows) - 1} requirements checked')
          PY

      - name: Full deterministic test suite
        run: pytest -q tests

      - name: Performance regression gate
        run: python -m scripts.performance_smoke

      - name: Full local browser E2E suite
        env:
          PREDIBEACON_PRODUCTION_SMOKE: '0'
        run: pytest -q browser_e2e

      - name: Allow merged deployment to settle
        run: sleep 90

      - name: Production API/domain audit
        run: python -m scripts.production_audit --deploy-timeout 600 --market-limit 50

      - name: Production public journey and responsive acceptance
        run: |
          pytest -q browser_e2e/test_production_smoke.py
          pytest -q browser_e2e/test_production_mobile.py
          pytest -q browser_e2e/test_production_outbound.py
          pytest -q browser_e2e/test_production_www.py

      - name: Verify external blocks remain explicit
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          requirements = Path('docs/REQUIREMENTS.md').read_text(encoding='utf-8')
          evidence = Path('docs/evidence/EXTERNAL_BLOCKS_2026-08-24.md').read_text(encoding='utf-8')
          blocked = re.findall(r'^\| (MP-\d+) \|.*?\| BLOCKED \|', requirements, re.MULTILINE)
          missing = [item for item in blocked if item not in requirements]
          if missing:
              raise SystemExit(f'Blocked requirement registry corruption: {missing}')
          if not evidence.strip():
              raise SystemExit('External-block evidence document is empty')
          forbidden = ('sk_live_', 'whsec_', 'pb_live_secret', 'revenue share %')
          lower = evidence.casefold()
          leaked = [token for token in forbidden if token.casefold() in lower]
          if leaked:
              raise SystemExit(f'Potential private credential/economics leakage in evidence: {leaked}')
          print(f'Explicit external blocks retained: {blocked}')
          PY

  publish-status:
    if: always()
    needs: final-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Publish final acceptance commit status
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RESULT: ${{ needs.final-acceptance.result }}
        run: |
          state="failure"
          description="Final project acceptance failed"
          if [[ "${ACCEPTANCE_RESULT}" == "success" ]]; then
            state="success"
            description="Final project acceptance passed"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="${description}" \
            -f context="predibeacon/final-acceptance"
          if [[ "${state}" != "success" ]]; then
            exit 1
          fi
