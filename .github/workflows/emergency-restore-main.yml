name: Emergency restore main.py
on:
  push:
    paths:
      - '.github/workflows/emergency-restore-main.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main.py from parent of accidental replacement
        run: |
          git checkout baa4addfcc0fc77a059bdaf1d7be308380d5893c^ -- app/main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git commit -m "fix: restore PrediBeacon application" || exit 0
          git push