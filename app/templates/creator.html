<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator markets — PrediBeacon</title>
<style nonce="__CSP_NONCE__">:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--muted:#aab4c3;--text:#f8fafc;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.wrap{width:min(950px,calc(100% - 2rem));margin:auto}header{padding:1.25rem 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:900;text-decoration:none}main{padding:3rem 0}h1{font-size:clamp(2.4rem,7vw,4rem)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.card{border:1px solid var(--line);border-radius:16px;padding:1.25rem;background:var(--panel)}.prob{font-size:2.5rem;font-weight:900}.button{display:inline-flex;padding:.8rem 1rem;background:var(--accent);color:var(--bg);border-radius:10px;text-decoration:none;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><a class="brand" href="/">PREDIBEACON</a></div></header><main class="wrap"><a href="/">← PrediBeacon</a><h1 id="title">Creator markets</h1><p class="muted">A tracked selection of prediction markets. Creator compensation, when applicable, is based only on reconciled partner revenue.</p><div id="state" class="muted">Loading…</div><div id="grid" class="grid"></div></main><script nonce="__CSP_NONCE__">
const creator=decodeURIComponent(location.pathname.split('/').pop()),grid=document.querySelector('#grid'),state=document.querySelector('#state');document.querySelector('#title').textContent='Markets selected by @'+creator;function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}async function load(){try{const r=await fetch('/api/v1/creators/'+encodeURIComponent(creator)+'/markets'),data=await r.json();grid.innerHTML=data.map(x=>`<article class="card"><span class="muted">${esc(x.market.venue)}</span><h2>${esc(x.market.title)}</h2><div class="prob">${x.market.probability==null?'—':Math.round(x.market.probability*100)+'%'}</div><p class="muted">Trend ${Math.round(x.market.trend_score)}/100</p><a class="button" href="/go/${encodeURIComponent(x.campaign.slug)}">Explore market</a></article>`).join('');state.textContent=data.length?data.length+' selected market'+(data.length===1?'':'s'):'No active market selections are available.'}catch{state.textContent='Creator markets are temporarily unavailable.'}}load();
</script></body></html>
