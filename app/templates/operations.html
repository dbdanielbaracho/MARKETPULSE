<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PrediBeacon · Operations</title>
<style nonce="__CSP_NONCE__">
:root{color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--text:#f8fafc;--muted:#aab4c3;--ok:#65d6ad;--warn:#f6c85f;--bad:#ff7c8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 2rem));margin:auto}header{border-bottom:1px solid var(--line);padding:1rem 0}header .wrap{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}a{color:var(--ok)}main{padding:2rem 0}.login,.summary,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem}.login{display:grid;grid-template-columns:1fr auto;gap:.75rem;margin-bottom:1rem}input,button{font:inherit;border-radius:9px;padding:.75rem}input{background:var(--bg);border:1px solid var(--line);color:var(--text)}button{border:0;background:var(--ok);color:#07120e;font-weight:800}.summary{margin-bottom:1rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.card h2{font-size:1rem;margin:.2rem 0}.card p{color:var(--muted);margin:.25rem 0}.ok{border-color:var(--ok)}.warning{border-color:var(--warn)}.critical{border-color:var(--bad)}.status{min-height:1.5rem;color:var(--muted)}dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem .75rem}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}@media(max-width:800px){.grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><strong>PrediBeacon operations</strong><nav><a href="/admin">Editorial review</a> · <a href="/">Public site</a></nav></div></header>
<main class="wrap">
<section class="login" aria-label="Administrator authentication">
<input id="token" type="password" autocomplete="off" placeholder="Administrator token" aria-label="Administrator token">
<button id="load" type="button">Load operations</button>
</section>
<p id="message" class="status" role="status" aria-live="polite">Token stays only in this page's memory.</p>
<section id="summary" class="summary" hidden></section>
<section id="checks" class="grid" aria-label="Operational checks"></section>
<section id="details" class="summary" hidden><h2>Runtime details</h2><dl id="detail-list"></dl></section>
</main>
<script nonce="__CSP_NONCE__">
const token=document.getElementById("token"),message=document.getElementById("message"),summary=document.getElementById("summary"),checks=document.getElementById("checks"),details=document.getElementById("details"),detailList=document.getElementById("detail-list");
function text(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
function render(payload){
 summary.hidden=false;summary.className="summary "+payload.overall;summary.replaceChildren(text("h1","Overall: "+payload.overall),text("p","Generated "+payload.generated_at));
 checks.replaceChildren(...payload.checks.map(item=>{const card=document.createElement("article");card.className="card "+item.severity;card.append(text("h2",item.name),text("p",item.ok?"PASS":"ATTENTION"),text("p",item.detail));return card}));
 const s=payload.status, rows=[["Version",s.version],["Freshness",s.freshness],["Kalshi markets",s.venue_market_counts.kalshi],["Polymarket markets",s.venue_market_counts.polymarket],["AI model",s.ai_drafts.model||"disabled"],["AI drafts today",s.ai_drafts.drafts_today+" / "+s.ai_drafts.daily_limit],["Storage identity",s.storage.identity||"unavailable"],["Automated publishing",String(s.automated_publishing_enabled)],["Social distribution",String(s.social_distribution_enabled)]];
 detailList.replaceChildren(...rows.flatMap(([k,v])=>[text("dt",k),text("dd",String(v))]));details.hidden=false;
}
async function load(){message.textContent="Loading…";summary.hidden=true;details.hidden=true;checks.replaceChildren();try{const response=await fetch("/api/v1/admin/operations",{headers:{"X-MarketPulse-Admin-Token":token.value}});if(!response.ok)throw new Error(response.status===401?"Invalid administrator token":"Unable to load operations");render(await response.json());message.textContent="Operations loaded."}catch(error){message.textContent=error.message}}
document.getElementById("load").addEventListener("click",load);token.addEventListener("keydown",event=>{if(event.key==="Enter")load()});
</script>
</body></html>
