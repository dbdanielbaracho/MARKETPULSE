<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PrediBeacon · Operations</title><style nonce="__CSP_NONCE__">:root{color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--text:#f8fafc;--muted:#aab4c3;--ok:#65d6ad;--warn:#f6c85f;--bad:#ff7c8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 2rem));margin:auto}header{border-bottom:1px solid var(--line);padding:1rem 0}header .wrap{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}a{color:var(--ok)}main{padding:2rem 0}.toolbar,.summary,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:1rem}button{font:inherit;border:0;border-radius:9px;padding:.75rem;background:var(--ok);color:#07120e;font-weight:800}.summary{margin-bottom:1rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.card h2{font-size:1rem;margin:.2rem 0}.card p{color:var(--muted);margin:.25rem 0}.ok{border-color:var(--ok)}.warning{border-color:var(--warn)}.critical{border-color:var(--bad)}.status{min-height:1.5rem;color:var(--muted)}dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem .75rem}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><strong>PrediBeacon operations</strong><nav><a href="/admin/dashboard">← Dashboard</a> · <a href="/">Public site</a></nav></div></header><main class="wrap"><section class="toolbar"><span>Secure administrator session</span><button id="load" type="button">Refresh operations</button></section><p id="message" class="status" role="status" aria-live="polite">Loading…</p><section id="summary" class="summary" hidden></section><section id="checks" class="grid"></section><section id="details" class="summary" hidden><h2>Runtime details</h2><dl id="detail-list"></dl></section></main><script nonce="__CSP_NONCE__">const message=document.getElementById('message'),summary=document.getElementById('summary'),checks=document.getElementById('checks'),details=document.getElementById('details'),detailList=document.getElementById('detail-list');function text(tag,value){const n=document.createElement(tag);n.textContent=value;return n}function render(p){summary.hidden=false;summary.className='summary '+p.overall;summary.replaceChildren(text('h1','Overall: '+p.overall),text('p','Generated '+p.generated_at));checks.replaceChildren(...p.checks.map(item=>{const c=document.createElement('article');c.className='card '+item.severity;c.append(text('h2',item.name),text('p',item.ok?'PASS':'ATTENTION'),text('p',item.detail));return c}));const s=p.status,rows=[['Version',s.version],['Freshness',s.freshness],['Kalshi markets',s.venue_market_counts.kalshi],['Polymarket markets',s.venue_market_counts.polymarket],['AI model',s.ai_drafts.model||'disabled'],['Storage identity',s.storage.identity||'unavailable'],['Automated publishing',String(s.automated_publishing_enabled)],['Social distribution',String(s.social_distribution_enabled)]];detailList.replaceChildren(...rows.flatMap(([k,v])=>[text('dt',k),text('dd',String(v))]));details.hidden=false}async function load(){message.textContent='Loading…';try{const r=await fetch('/api/v1/admin/operations',{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.replace('/admin/login?next='+encodeURIComponent(location.pathname));return}if(!r.ok)throw new Error('Unable to load operations');render(await r.json());message.textContent='Operations loaded.'}catch(e){message.textContent=e.message}}document.getElementById('load').onclick=load;load();</script></body></html>
