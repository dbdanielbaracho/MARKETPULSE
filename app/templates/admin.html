<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MarketPulse · Editorial review</title>
<style nonce="__CSP_NONCE__">
:root{color-scheme:dark;--bg:#0e0d14;--panel:#171522;--line:#302c42;--text:#f4f1ff;--muted:#aaa3bd;--accent:#a778ff;--ok:#58c99d;--danger:#ff7c8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{width:min(100% - 2rem,980px);margin:auto}header{border-bottom:1px solid var(--line);padding:1.2rem 0}h1{margin:0;font-size:1.35rem}main{padding:2rem 0}.login,.draft,.empty{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-bottom:1rem}label{display:block;color:var(--muted);margin-bottom:.4rem}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;background:#0f0e16;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:.75rem}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}button{border:0;border-radius:9px;padding:.7rem 1rem;cursor:pointer;background:var(--accent);color:#100c18;font-weight:700}button.secondary{background:#302c42;color:var(--text)}button.reject{background:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed}.meta{color:var(--muted);font-size:.88rem}.body{white-space:pre-wrap}.status{min-height:1.5rem;color:var(--muted)}.error{color:var(--danger)}.success{color:var(--ok)}code{overflow-wrap:anywhere}
</style>
</head>
<body>
<header><div class="wrap"><h1>MarketPulse · Editorial review</h1></div></header>
<main class="wrap">
<section class="login" aria-labelledby="access-title">
<h2 id="access-title">Secure access</h2>
<p class="meta">The token stays only in this browser tab and is never stored locally.</p>
<label for="token">Admin token</label>
<input id="token" type="password" autocomplete="off" spellcheck="false">
<div class="actions">
<button id="connect" type="button">Open review queue</button>
<button id="clear" type="button" class="secondary">Clear session</button>
</div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</section>
<section aria-labelledby="queue-title">
<h2 id="queue-title">Drafts pending review</h2>
<div id="drafts"><div class="empty">Authenticate to load drafts.</div></div>
</section>
</main>
<script nonce="__CSP_NONCE__">
(()=>{let sessionToken='';const token=document.querySelector('#token'),connect=document.querySelector('#connect'),clear=document.querySelector('#clear'),status=document.querySelector('#status'),drafts=document.querySelector('#drafts');
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
function message(text,kind=''){status.textContent=text;status.className='status '+kind}
async function request(path,options={}){const headers=new Headers(options.headers||{});headers.set('X-MarketPulse-Admin-Token',sessionToken);if(options.body)headers.set('Content-Type','application/json');const response=await fetch(path,{...options,headers,credentials:'omit',cache:'no-store'});if(!response.ok){let detail='Request failed';try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}return response.json()}
function render(items){if(!items.length){drafts.innerHTML='<div class="empty">No drafts are pending review.</div>';return}drafts.innerHTML=items.map(item=>`<article class="draft" data-id="${esc(item.draft_id)}"><div class="meta"><code>${esc(item.draft_id)}</code> · ${esc(item.generator)} · ${esc(item.created_at)}</div><h3>${esc(item.headline)}</h3><div class="body">${esc(item.body)}</div><p class="meta">Citations: ${item.citation_ids.map(esc).join(', ')}</p><label>Editorial reason<textarea maxlength="500" placeholder="Explain the approval or rejection decision"></textarea></label><div class="actions"><button type="button" data-decision="approved">Approve</button><button type="button" class="reject" data-decision="rejected">Reject</button></div></article>`).join('')}
async function load(){sessionToken=token.value.trim();if(sessionToken.length<32){message('Enter the complete admin token.','error');return}connect.disabled=true;message('Loading review queue…');try{render(await request('/api/v1/admin/drafts?state=pending_review&limit=50'));token.value='';message('Secure session active.','success')}catch(error){sessionToken='';message(error.message,'error')}finally{connect.disabled=false}}
connect.addEventListener('click',load);clear.addEventListener('click',()=>{sessionToken='';token.value='';drafts.innerHTML='<div class="empty">Session cleared.</div>';message('Token removed from this tab.')});
drafts.addEventListener('click',async event=>{const button=event.target.closest('[data-decision]');if(!button)return;const article=button.closest('[data-id]'),reason=article.querySelector('textarea').value.trim();if(reason.length<3){message('Add an editorial reason before reviewing.','error');return}button.disabled=true;try{await request('/api/v1/admin/drafts/'+encodeURIComponent(article.dataset.id)+'/review',{method:'POST',body:JSON.stringify({decision:button.dataset.decision,reason})});article.remove();message('Review decision saved and audited.','success');if(!drafts.querySelector('.draft'))render([])}catch(error){message(error.message,'error');button.disabled=false}});
})();
</script>
</body>
</html>
