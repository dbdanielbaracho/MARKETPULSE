<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PrediBeacon · Editorial</title><style nonce="__CSP_NONCE__">:root{color-scheme:dark;--bg:#0e0d14;--panel:#171522;--line:#302c42;--text:#f4f1ff;--muted:#aaa3bd;--accent:#a778ff;--ok:#58c99d;--danger:#ff7c8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{width:min(100% - 2rem,1050px);margin:auto}header{border-bottom:1px solid var(--line);padding:1.2rem 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#d8c8ff}h1{margin:0;font-size:1.35rem}main{padding:2rem 0}.item,.empty,.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-bottom:1rem}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.column h2{font-size:1.05rem}label{display:block;color:var(--muted);margin-bottom:.4rem}input,textarea,button{font:inherit}input,textarea{width:100%;background:#0f0e16;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:.75rem}textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}button{border:0;border-radius:9px;padding:.7rem 1rem;cursor:pointer;background:var(--accent);color:#100c18;font-weight:700}button.secondary{background:#302c42;color:var(--text)}button.reject,button.rollback{background:var(--danger)}button.publish,button.schedule{background:var(--ok)}button:disabled{opacity:.55;cursor:not-allowed}.meta{color:var(--muted);font-size:.82rem}.body{white-space:pre-wrap;max-height:14rem;overflow:auto}.status{min-height:1.5rem;color:var(--muted)}.error{color:var(--danger)}.success{color:var(--ok)}code{overflow-wrap:anywhere}.counts{color:var(--muted);font-weight:400}@media(max-width:850px){.columns{grid-template-columns:1fr}}</style></head><body><header><div class="wrap top"><h1>PrediBeacon · Editorial</h1><a href="/admin/dashboard">← Dashboard</a></div></header><main class="wrap"><section class="toolbar"><div class="actions"><button id="refresh" type="button" class="secondary">Refresh workspace</button></div><p id="status" class="status" role="status" aria-live="polite">Loading secure workspace…</p></section><div class="columns"><section class="column"><h2>Pending review <span id="pending-count" class="counts"></span></h2><div id="pending"><div class="empty">Loading…</div></div></section><section class="column"><h2>Approved, not published <span id="approved-count" class="counts"></span></h2><div id="approved"><div class="empty">Loading…</div></div></section><section class="column"><h2>Published <span id="published-count" class="counts"></span></h2><div id="published"><div class="empty">Loading…</div></div></section></div></main><script nonce="__CSP_NONCE__">(()=>{const refresh=document.querySelector('#refresh'),status=document.querySelector('#status'),pending=document.querySelector('#pending'),approved=document.querySelector('#approved'),published=document.querySelector('#published');const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};function message(t,k=''){status.textContent=t;status.className='status '+k}async function request(path,options={}){const headers=new Headers(options.headers||{});if(options.body)headers.set('Content-Type','application/json');const response=await fetch(path,{...options,headers,credentials:'same-origin',cache:'no-store'});if(response.status===401){location.replace('/admin/login?next='+encodeURIComponent(location.pathname));throw new Error('Session expired')}if(!response.ok){let detail='Request failed';try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}return response.json()}function reasonBox(a){return `<label>Editorial reason<textarea maxlength="500" placeholder="Explain this ${a} decision"></textarea></label>`}function empty(t,x){t.innerHTML='<div class="empty">'+esc(x)+'</div>'}function renderDrafts(t,items,state){if(!items.length){empty(t,state==='pending_review'?'No drafts are pending review.':'No approved drafts await publication.');return}t.innerHTML=items.map(item=>`<article class="item" data-draft-id="${esc(item.draft_id)}"><div class="meta"><code>${esc(item.draft_id)}</code> · ${esc(item.generator)} · ${esc(item.created_at)}</div><h3>${esc(item.headline)}</h3><div class="body">${esc(item.body)}</div><p class="meta">Citations: ${item.citation_ids.map(esc).join(', ')}</p>${reasonBox(state==='pending_review'?'review':'publication')}${state==='approved'?'<label>Schedule time<input type="datetime-local" data-schedule-time></label>':''}<div class="actions">${state==='pending_review'?'<button type="button" data-decision="approved">Approve</button><button type="button" class="reject" data-decision="rejected">Reject</button>':'<button type="button" class="publish" data-publish>Publish manually</button><button type="button" class="schedule" data-schedule>Schedule publication</button>'}</div></article>`).join('')}function renderPublications(items){if(!items.length){empty(published,'No articles are currently published.');return}published.innerHTML=items.map(item=>`<article class="item" data-publication-id="${esc(item.publication_id)}"><div class="meta"><code>${esc(item.publication_id)}</code> · v${item.version} · ${esc(item.published_at)}</div><h3><a href="/articles/${encodeURIComponent(item.slug)}" target="_blank" rel="noopener noreferrer">${esc(item.headline)}</a></h3>${reasonBox('rollback')}<div class="actions"><button type="button" class="rollback" data-rollback>Rollback</button></div></article>`).join('')}async function load(){refresh.disabled=true;message('Loading editorial workspace…');try{const [p,a,u]=await Promise.all([request('/api/v1/admin/drafts?state=pending_review&limit=50'),request('/api/v1/admin/drafts?state=approved&limit=50'),request('/api/v1/admin/publications?state=active&limit=50')]);renderDrafts(pending,p,'pending_review');renderDrafts(approved,a,'approved');renderPublications(u);document.querySelector('#pending-count').textContent='('+p.length+')';document.querySelector('#approved-count').textContent='('+a.length+')';document.querySelector('#published-count').textContent='('+u.length+')';message('Secure editorial workspace active.','success')}catch(e){message(e.message,'error')}finally{refresh.disabled=false}}refresh.onclick=load;document.addEventListener('click',async e=>{const b=e.target.closest('[data-decision],[data-publish],[data-schedule],[data-rollback]');if(!b)return;const article=b.closest('.item'),reason=article.querySelector('textarea').value.trim();if(reason.length<3){message('Add an editorial reason before continuing.','error');return}b.disabled=true;try{if(b.dataset.decision)await request('/api/v1/admin/drafts/'+encodeURIComponent(article.dataset.draftId)+'/review',{method:'POST',body:JSON.stringify({decision:b.dataset.decision,reason})});else if(b.hasAttribute('data-publish'))await request('/api/v1/admin/drafts/'+encodeURIComponent(article.dataset.draftId)+'/publish',{method:'POST',body:JSON.stringify({reason})});else if(b.hasAttribute('data-schedule')){const v=article.querySelector('[data-schedule-time]').value;if(!v)throw new Error('Choose a publication date and time.');await request('/api/v1/admin/drafts/'+encodeURIComponent(article.dataset.draftId)+'/schedule',{method:'POST',body:JSON.stringify({scheduled_at:new Date(v).toISOString(),reason})})}else await request('/api/v1/admin/publications/'+encodeURIComponent(article.dataset.publicationId)+'/rollback',{method:'POST',body:JSON.stringify({reason})});await load()}catch(err){message(err.message,'error');b.disabled=false}});load()})();</script></body></html>
