<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PrediBeacon · Insights</title><style nonce="__CSP_NONCE__">:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border:1px solid #dfe4ec;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.metric strong{font-size:28px;display:block}.muted{color:#667085}a{color:#344054}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#eee;padding:12px;border-radius:8px}.go{color:#067647}.nogo{color:#b42318}</style></head><body><div class="wrap"><div class="top"><div><h1>Analytics & Launch Readiness</h1><p class="muted">First-party acquisition funnel and current launch checks.</p></div><a href="/admin/dashboard">← Dashboard</a></div><section class="card"><h2>Traffic funnel · 30 days</h2><div id="traffic" class="grid"><span class="muted">Loading…</span></div></section><section class="card"><h2>Launch decision</h2><div id="decision" class="muted">Loading…</div><div id="checks" class="grid"></div></section></div><script nonce="__CSP_NONCE__">(()=>{const esc=v=>String(v??'—');async function api(path){const r=await fetch(path,{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.replace('/admin/login?next='+encodeURIComponent(location.pathname));throw new Error('Session expired')}if(!r.ok)throw new Error('Unable to load admin data');return r.json()}async function load(){try{const [t,l]=await Promise.all([api('/api/v1/admin/traffic?days=30&top_markets=20'),api('/api/v1/admin/launch-readiness')]);const f=t.funnel;document.getElementById('traffic').innerHTML=[['Home views',f.home_views],['Market views',f.market_detail_views],['Outbound clicks',f.outbound_clicks],['Home → market',f.home_to_market_rate==null?'—':(f.home_to_market_rate*100).toFixed(1)+'%'],['Market → outbound',f.market_to_outbound_rate==null?'—':(f.market_to_outbound_rate*100).toFixed(1)+'%']].map(([k,v])=>`<article class="metric"><span class="muted">${k}</span><strong>${esc(v)}</strong></article>`).join('');document.getElementById('decision').innerHTML=`<strong class="${l.decision==='GO'?'go':'nogo'}">${l.decision}</strong> · ${l.warning_count} warning(s)`;document.getElementById('checks').innerHTML=l.checks.map(c=>`<article class="card"><strong>${c.ok?'✓':'!'} ${c.name}</strong><p class="muted">${esc(typeof c.detail==='string'?c.detail:JSON.stringify(c.detail))}</p></article>`).join('')}catch(e){document.getElementById('decision').textContent=e.message}}load()})();</script></body></html>
