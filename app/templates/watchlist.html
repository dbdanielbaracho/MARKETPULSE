<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchlist — PrediBeacon</title><style nonce="__CSP_NONCE__">
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--muted:#aab4c3;--text:#f8fafc;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}
.wrap{width:min(1000px,calc(100% - 2rem));margin:auto}header{padding:1.25rem 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:900;text-decoration:none}
main{padding:3rem 0}h1{font-size:clamp(2.2rem,7vw,4rem)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:1.25rem}
.prob{font-size:2.5rem;font-weight:900}.actions{display:flex;gap:.6rem;flex-wrap:wrap}.button{display:inline-flex;min-height:44px;align-items:center;border-radius:10px;padding:.7rem 1rem;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit}.primary{background:var(--accent);color:var(--bg);font-weight:800}
@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="wrap"><a class="brand" href="/">PREDIBEACON</a></div></header><main class="wrap"><p><a href="/">← Trending markets</a></p><h1>Your watchlist</h1><p class="muted">Saved in this browser. No account or financial custody is required.</p><div id="state" class="muted">Loading saved markets…</div><div id="grid" class="grid"></div></main>
<script nonce="__CSP_NONCE__">
const grid=document.querySelector('#grid'),state=document.querySelector('#state');function list(){try{return JSON.parse(localStorage.getItem('predibeacon-watchlist')||'[]')}catch{return[]}}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
async function load(){const ids=list();if(!ids.length){state.textContent='Your watchlist is empty. Add markets from any market detail page.';return}const results=await Promise.all(ids.map(async id=>{try{const r=await fetch('/api/v1/market?'+new URLSearchParams({market_id:id}));return r.ok?await r.json():null}catch{return null}}));const markets=results.filter(Boolean);grid.innerHTML=markets.map(m=>`<article class="card"><div class="muted">${esc(m.venue)}</div><h2>${esc(m.title)}</h2><div class="prob">${m.probability==null?'—':Math.round(m.probability*100)+'%'}</div><p class="muted">Trend ${Math.round(m.trend_score)}/100</p><div class="actions"><a class="button primary" href="/market?${new URLSearchParams({market_id:m.canonical_id})}">Explore market</a><button class="button remove" data-id="${esc(m.canonical_id)}" type="button">Remove</button></div></article>`).join('');state.textContent=markets.length?markets.length+' saved market'+(markets.length===1?'':'s'):'Saved markets are no longer available.'}
grid.addEventListener('click',e=>{const b=e.target.closest('.remove');if(!b)return;localStorage.setItem('predibeacon-watchlist',JSON.stringify(list().filter(x=>x!==b.dataset.id)));load()});load();
</script></body></html>
