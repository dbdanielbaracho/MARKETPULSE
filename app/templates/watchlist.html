<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchlist — PrediBeacon</title><style nonce="__CSP_NONCE__">
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--muted:#aab4c3;--text:#f8fafc;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}
.wrap{width:min(1050px,calc(100% - 2rem));margin:auto}header{padding:1.25rem 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:900;text-decoration:none}
main{padding:3rem 0}h1{font-size:clamp(2.2rem,7vw,4rem);margin-bottom:.5rem}.muted{color:var(--muted);line-height:1.55}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:.06em;font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1.5rem}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:1.25rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:center}.venue{display:inline-flex;border-radius:999px;padding:.35rem .65rem;font-weight:900;font-size:.8rem;letter-spacing:.04em}.venue.kalshi{background:#16a085;color:#fff}.venue.polymarket{background:#1f5eff;color:#fff}.prob{font-size:2.6rem;font-weight:900;margin:.8rem 0 .15rem}.move{font-weight:800;color:var(--accent)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1rem 0}.fact{border-top:1px solid var(--line);padding-top:.65rem;font-size:.85rem;color:var(--muted)}.fact strong{display:block;color:var(--text);margin-top:.25rem}.actions{display:flex;gap:.6rem;flex-wrap:wrap}.button{display:inline-flex;min-height:44px;align-items:center;border-radius:10px;padding:.7rem 1rem;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit}.primary{background:var(--accent);color:var(--bg);font-weight:900}.empty{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:1.5rem;margin-top:1.5rem}.empty a{display:inline-flex;margin-top:.75rem}.warning{border-color:#fbbf24}@media(max-width:700px){.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body>
<header><div class="wrap"><a class="brand" href="/">PREDIBEACON</a></div></header><main class="wrap"><p><a href="/">← Markets</a></p><div class="eyebrow">YOUR INTELLIGENCE</div><h1>Watchlist</h1><p class="muted">Markets you chose to follow, with current probability, movement and timing. Saved only in this browser.</p><div id="state" class="muted">Loading saved markets…</div><div id="grid" class="grid"></div></main>
<script nonce="__CSP_NONCE__">
const grid=document.querySelector('#grid'),state=document.querySelector('#state');function list(){try{return JSON.parse(localStorage.getItem('predibeacon-watchlist')||'[]')}catch{return[]}}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function money(v){return v==null?'Unavailable':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact'}).format(v)}function closeLabel(v){if(!v)return 'Not published';const ms=new Date(v).getTime()-Date.now();if(ms<=0)return 'Closed';const h=Math.round(ms/3600000);if(h<24)return h+'h';const d=Math.round(h/24);return d+'d'}function detail(m){return m.slug?'/markets/'+encodeURIComponent(m.slug):'/market?'+new URLSearchParams({market_id:m.canonical_id})}
async function load(){const ids=list();grid.innerHTML='';if(!ids.length){state.innerHTML='<div class="empty"><strong>Your watchlist is empty.</strong><p class="muted">Open any market that matters to you and choose “Add to watchlist”. PrediBeacon will keep it here for quick follow-up.</p><a class="button primary" href="/">Explore current markets</a></div>';return}const results=await Promise.all(ids.map(async id=>{try{const r=await fetch('/api/v1/market?'+new URLSearchParams({market_id:id}));return r.ok?await r.json():null}catch{return null}}));const markets=results.filter(Boolean),missing=ids.length-markets.length;grid.innerHTML=markets.map(m=>{const move=m.probability_change==null?'Change unavailable':(m.probability_change>=0?'▲ ':'▼ ')+Math.abs(m.probability_change*100).toFixed(1)+' pts';return `<article class="card"><div class="top"><span class="venue ${esc(m.venue)}">${m.venue==='kalshi'?'KALSHI':'POLYMARKET'}</span><span class="muted">Trend ${Math.round(m.trend_score)}/100</span></div><h2>${esc(m.title)}</h2><div class="prob">${m.probability==null?'—':Math.round(m.probability*100)+'%'}</div><div class="move">${esc(move)}</div><div class="facts"><div class="fact">Reported volume<strong>${esc(money(m.volume_usd))}</strong></div><div class="fact">Closes in<strong>${esc(closeLabel(m.closes_at))}</strong></div><div class="fact">Platform<strong>${m.venue==='kalshi'?'Kalshi':'Polymarket'}</strong></div></div><div class="actions"><a class="button primary" href="${esc(detail(m))}">View analysis</a><a class="button" href="/alerts?${new URLSearchParams({market_id:m.canonical_id})}">Create alert</a><button class="button remove" data-id="${esc(m.canonical_id)}" type="button">Remove</button></div></article>`}).join('');state.textContent=markets.length?markets.length+' market'+(markets.length===1?'':'s')+' being followed.':'';if(missing){state.innerHTML+=`<div class="empty warning"><strong>${missing} saved market${missing===1?' is':'s are'} no longer available.</strong><p class="muted">It may have closed or disappeared from the current provider feed. PrediBeacon does not silently replace it with another contract.</p></div>`}}
grid.addEventListener('click',e=>{const b=e.target.closest('.remove');if(!b)return;localStorage.setItem('predibeacon-watchlist',JSON.stringify(list().filter(x=>x!==b.dataset.id)));load()});load();
</script></body></html>
