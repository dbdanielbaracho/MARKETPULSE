<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrediBeacon market widget</title><style nonce="__CSP_NONCE__">:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#111827;--line:#273244;--muted:#aab4c3;--text:#f8fafc;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.widget{border:1px solid var(--line);border-radius:14px;padding:1rem;min-height:210px}.brand{font-weight:900;color:var(--accent);font-size:.8rem}.prob{font-size:2.6rem;font-weight:900}.muted{color:var(--muted)}a{color:inherit}.cta{display:inline-block;background:var(--accent);color:#090d14;padding:.65rem .8rem;border-radius:8px;text-decoration:none;font-weight:900}</style></head><body><article class="widget"><div class="brand">POWERED BY PREDIBEACON</div><h2 id="title">Loading market…</h2><div class="prob" id="prob"></div><p class="muted" id="meta"></p><a class="cta" id="link" target="_blank" rel="noopener noreferrer">Explore market ↗</a></article><script nonce="__CSP_NONCE__">
const id=new URLSearchParams(location.search).get('market_id');async function load(){try{const r=await fetch('/api/v1/market?'+new URLSearchParams({market_id:id}));if(!r.ok)throw new Error();const m=await r.json();document.querySelector('#title').textContent=m.title;document.querySelector('#prob').textContent=m.probability==null?'—':Math.round(m.probability*100)+'%';document.querySelector('#meta').textContent=m.venue+' · Trend '+Math.round(m.trend_score)+'/100';document.querySelector('#link').href='/market?'+new URLSearchParams({market_id:id,campaign_id:'embed',channel:'embed'})}catch{document.querySelector('#title').textContent='Market unavailable';document.querySelector('#link').hidden=true}}load();
</script></body></html>
