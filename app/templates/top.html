<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top markets today — PrediBeacon</title>
<style nonce="__CSP_NONCE__">:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--muted:#aab4c3;--text:#f8fafc;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.wrap{width:min(1050px,calc(100% - 2rem));margin:auto}header{padding:1.25rem 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:900;text-decoration:none}main{padding:3rem 0}h1{font-size:clamp(2.4rem,7vw,4.5rem)}.tabs{display:flex;gap:.6rem;overflow:auto;margin:1.5rem 0}.tab{border:1px solid var(--line);border-radius:999px;padding:.75rem 1rem;background:transparent;color:var(--text);font:inherit;white-space:nowrap}.tab[aria-pressed=true]{background:var(--accent);color:var(--bg)}.grid{display:grid;gap:1rem}.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;border:1px solid var(--line);border-radius:14px;padding:1rem;background:var(--panel);text-decoration:none}.rank,.prob{font-size:1.8rem;font-weight:900}.muted{color:var(--muted)}@media(max-width:600px){.card{grid-template-columns:auto 1fr}.prob{grid-column:2}}</style></head><body><header><div class="wrap"><a class="brand" href="/">PREDIBEACON</a></div></header><main class="wrap"><a href="/">← All markets</a><h1>Top markets today</h1><p class="muted">The questions gaining attention across supported prediction-market platforms.</p><div class="tabs"><button class="tab" data-sort="trending" aria-pressed="true">Trending</button><button class="tab" data-sort="movers" aria-pressed="false">Biggest movers</button><button class="tab" data-sort="volume" aria-pressed="false">Most volume</button></div><div id="state" class="muted">Loading…</div><div id="grid" class="grid"></div></main><script nonce="__CSP_NONCE__">
const grid=document.querySelector('#grid'),state=document.querySelector('#state');function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}async function load(sort){state.textContent='Loading…';try{const r=await fetch('/api/v1/markets?'+new URLSearchParams({sort,limit:'10'})),data=await r.json();grid.innerHTML=data.map((m,i)=>`<a class="card" href="/market?${new URLSearchParams({market_id:m.canonical_id,campaign_id:'top-'+sort,channel:'onsite'})}"><span class="rank">#${i+1}</span><span><strong>${esc(m.title)}</strong><br><span class="muted">${esc(m.venue)} · Trend ${Math.round(m.trend_score)}</span></span><span class="prob">${m.probability==null?'—':Math.round(m.probability*100)+'%'}</span></a>`).join('');state.textContent=data.length?'':'No markets are available.'}catch{state.textContent='Rankings are temporarily unavailable.'}}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));load(b.dataset.sort)}));load('trending');
</script></body></html>
