<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market alerts — PrediBeacon</title><link rel="manifest" href="/manifest.webmanifest">
<style nonce="__CSP_NONCE__">:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--muted:#aab4c3;--text:#f8fafc;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.wrap{width:min(900px,calc(100% - 2rem));margin:auto}header{padding:1.25rem 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:900;text-decoration:none}main{padding:3rem 0}h1{font-size:clamp(2.4rem,7vw,4rem);margin-bottom:.4rem}.muted{color:var(--muted);line-height:1.55}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:.06em;font-size:.8rem}.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:1.25rem;margin:1rem 0}.form{display:grid;grid-template-columns:2fr 1fr auto;gap:.75rem}.input,.button{min-height:48px;border:1px solid var(--line);border-radius:10px;padding:.75rem;background:var(--bg);color:var(--text);font:inherit}.button{background:var(--accent);color:var(--bg);font-weight:900}.alert{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;border-top:1px solid var(--line);padding:1rem 0}.alert:first-child{border-top:0}.badge{display:inline-flex;border-radius:999px;padding:.25rem .55rem;border:1px solid var(--line);font-size:.75rem;font-weight:800;margin-top:.35rem}.empty{border:1px dashed var(--line);border-radius:12px;padding:1rem}.secondary{background:transparent;color:var(--text)}@media(max-width:650px){.form{grid-template-columns:1fr}.alert{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><a class="brand" href="/">PREDIBEACON</a></div></header><main class="wrap"><a href="/">← Markets</a><div class="eyebrow" style="margin-top:2rem">FOLLOW WHAT MATTERS</div><h1>Market alerts</h1><p class="muted">Get a browser notification while PrediBeacon is open when a market you follow reaches your probability threshold. Preferences stay in this browser.</p><section class="panel"><h2>Create an alert</h2><div class="form"><select class="input" id="market" aria-label="Choose market"><option value="">Loading markets…</option></select><input class="input" id="threshold" type="number" min="1" max="99" value="70" aria-label="Probability threshold"><button class="button" id="add" type="button">Create alert</button></div><p id="message" class="muted"></p></section><section class="panel"><h2>Saved alerts</h2><div id="alerts"></div></section></main><script nonce="__CSP_NONCE__">
const key='predibeacon-alerts',marketSelect=document.querySelector('#market'),thresholdInput=document.querySelector('#threshold'),box=document.querySelector('#alerts'),message=document.querySelector('#message'),requested=new URLSearchParams(location.search).get('market_id')||'';let known=new Map();function list(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function watchlist(){try{return JSON.parse(localStorage.getItem('predibeacon-watchlist')||'[]')}catch{return[]}}function save(v){localStorage.setItem(key,JSON.stringify(v));render()}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
async function market(id){if(known.has(id))return known.get(id);try{const r=await fetch('/api/v1/market?'+new URLSearchParams({market_id:id}));if(!r.ok)return null;const m=await r.json();known.set(id,m);return m}catch{return null}}
async function populate(){const ids=[...new Set([requested,...watchlist(),...list().map(x=>x.market_id)].filter(Boolean))];const results=(await Promise.all(ids.map(market))).filter(Boolean);marketSelect.innerHTML='';if(!results.length){marketSelect.innerHTML='<option value="">Choose a market from a market page or Watchlist</option>';message.innerHTML='No market has been selected yet. <a href="/">Open a market</a> and use “Create alert”, or add it to your Watchlist.';return}for(const m of results){const option=document.createElement('option');option.value=m.canonical_id;option.textContent=(m.venue==='kalshi'?'Kalshi':'Polymarket')+' · '+m.title;marketSelect.append(option)}if(requested&&results.some(m=>m.canonical_id===requested))marketSelect.value=requested}
async function add(){const id=marketSelect.value,threshold=Number(thresholdInput.value);if(!id){message.textContent='Choose a market first.';return}if(threshold<1||threshold>99){message.textContent='Choose a probability threshold from 1% to 99%.';return}const m=await market(id);if(!m){message.textContent='That market is no longer available.';return}if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();const items=list().filter(x=>x.market_id!==id);items.push({market_id:id,threshold,last_probability:m.probability==null?null:Math.round(m.probability*100),triggered:false});save(items);message.textContent='Alert saved for '+m.title+'.'}
async function render(){const items=list();if(!items.length){box.innerHTML='<div class="empty muted">No alerts saved yet. Alerts are most useful for markets already in your Watchlist.</div>';return}const rows=[];for(const x of items){const m=await market(x.market_id);const title=m?m.title:'Market no longer available',venue=m?(m.venue==='kalshi'?'KALSHI':'POLYMARKET'):'UNAVAILABLE',current=x.last_probability==null?'Current probability unavailable':'Last seen at '+x.last_probability+'%';rows.push(`<div class="alert"><span><strong>${esc(title)}</strong><br><span class="muted">Notify at ${x.threshold}% or higher · ${esc(current)}</span><br><span class="badge">${venue}</span></span><button class="input secondary remove" data-id="${esc(x.market_id)}" type="button">Remove</button></div>`)}box.innerHTML=rows.join('')}
async function check(){const items=list();let changed=false;for(const item of items){const m=await market(item.market_id);if(!m)continue;const p=m.probability==null?null:Math.round(m.probability*100);if(p!=null&&p>=item.threshold&&!item.triggered){item.triggered=true;changed=true;if('Notification'in window&&Notification.permission==='granted')new Notification('PrediBeacon market alert',{body:m.title+' reached '+p+'%'})}if(p!=null&&p<item.threshold&&item.triggered){item.triggered=false;changed=true}if(item.last_probability!==p){item.last_probability=p;changed=true}}if(changed)localStorage.setItem(key,JSON.stringify(items));known=new Map();await render()}
document.querySelector('#add').addEventListener('click',add);box.addEventListener('click',e=>{const b=e.target.closest('.remove');if(b)save(list().filter(x=>x.market_id!==b.dataset.id))});populate().then(render);check();setInterval(check,300000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js');
</script></body></html>
