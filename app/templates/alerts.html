<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market alerts — PrediBeacon</title><link rel="manifest" href="/manifest.webmanifest">
<style nonce="__CSP_NONCE__">:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--muted:#aab4c3;--text:#f8fafc;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.wrap{width:min(900px,calc(100% - 2rem));margin:auto}header{padding:1.25rem 0;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-weight:900;text-decoration:none}main{padding:3rem 0}h1{font-size:clamp(2.4rem,7vw,4rem)}.muted{color:var(--muted)}.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:1.25rem;margin:1rem 0}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:.75rem}.input,.button{min-height:48px;border:1px solid var(--line);border-radius:10px;padding:.75rem;background:var(--bg);color:var(--text);font:inherit}.button{background:var(--accent);color:var(--bg);font-weight:900}.alert{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;border-top:1px solid var(--line);padding:1rem 0}@media(max-width:650px){.form{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><a class="brand" href="/">PREDIBEACON</a></div></header><main class="wrap"><a href="/">← Markets</a><h1>Market alerts</h1><p class="muted">Receive a browser notification while PrediBeacon is open when a saved market reaches your probability threshold. Preferences stay in this browser.</p><section class="panel"><h2>Create an alert</h2><div class="form"><input class="input" id="market-id" placeholder="Market ID" aria-label="Market ID"><input class="input" id="threshold" type="number" min="1" max="99" value="70" aria-label="Probability threshold"><button class="button" id="add" type="button">Notify me</button></div><p id="message" class="muted"></p></section><section class="panel"><h2>Saved alerts</h2><div id="alerts"></div></section></main><script nonce="__CSP_NONCE__">
const key='predibeacon-alerts',marketInput=document.querySelector('#market-id'),thresholdInput=document.querySelector('#threshold'),box=document.querySelector('#alerts'),message=document.querySelector('#message');marketInput.value=new URLSearchParams(location.search).get('market_id')||'';function list(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function save(v){localStorage.setItem(key,JSON.stringify(v));render()}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
async function add(){const id=marketInput.value.trim(),threshold=Number(thresholdInput.value);if(!id||threshold<1||threshold>99){message.textContent='Enter a market and a threshold from 1 to 99.';return}const r=await fetch('/api/v1/market?'+new URLSearchParams({market_id:id}));if(!r.ok){message.textContent='Market not found.';return}if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();const items=list().filter(x=>x.market_id!==id);items.push({market_id:id,threshold,last_probability:null,triggered:false});save(items);message.textContent='Alert saved in this browser.'}
function render(){const items=list();box.innerHTML=items.length?items.map(x=>`<div class="alert"><span><strong>${esc(x.market_id)}</strong><br><span class="muted">Notify at ${x.threshold}% or higher</span></span><button class="input remove" data-id="${esc(x.market_id)}" type="button">Remove</button></div>`).join(''):'<p class="muted">No alerts saved.</p>'}
async function check(){const items=list();let changed=false;for(const item of items){try{const r=await fetch('/api/v1/market?'+new URLSearchParams({market_id:item.market_id}));if(!r.ok)continue;const m=await r.json(),p=m.probability==null?null:Math.round(m.probability*100);if(p!=null&&p>=item.threshold&&!item.triggered){item.triggered=true;changed=true;if('Notification'in window&&Notification.permission==='granted')new Notification('PrediBeacon market alert',{body:m.title+' reached '+p+'%'});}if(p!=null&&p<item.threshold){item.triggered=false;changed=true}item.last_probability=p}catch{}}if(changed)localStorage.setItem(key,JSON.stringify(items));render()}
document.querySelector('#add').addEventListener('click',add);box.addEventListener('click',e=>{const b=e.target.closest('.remove');if(b)save(list().filter(x=>x.market_id!==b.dataset.id))});render();check();setInterval(check,300000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js');
</script></body></html>
