<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>PrediBeacon Admin</title>
<style nonce="__CSP_NONCE__">
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(440px,100%)}.brand{font-weight:800;font-size:28px;margin-bottom:18px}.card{background:white;border:1px solid #dfe4ec;border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(20,35,70,.08)}h1{margin:0 0 8px;font-size:24px}.muted{color:#667085;font-size:14px}label{display:block;font-weight:700;font-size:13px;margin:16px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #cbd2dc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:12px 14px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:800;font:inherit;cursor:pointer}.status{min-height:22px;margin-top:12px;font-size:13px}.error{color:#b42318}.ok{color:#067647}.twofa{display:none}.twofa.show{display:block}.foot{margin-top:16px;text-align:center;font-size:12px;color:#98a2b3}
</style>
</head>
<body><main class="shell"><div class="brand">PrediBeacon</div><section class="card"><h1>Administrator sign in</h1><p class="muted">Private operations, monetization and publishing workspace.</p><label for="email">Email</label><input id="email" type="email" autocomplete="username" value="admin@predibeacon.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><div id="twofa" class="twofa"><label for="totp">Authenticator code</label><input id="totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div><button id="login" type="button">Sign in</button><div id="status" class="status" role="status" aria-live="polite"></div></section><div class="foot">Secure admin area · not indexed · session expires automatically</div></main>
<script nonce="__CSP_NONCE__">(()=>{const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get('next')||'/admin/dashboard';async function status(){try{const r=await fetch('/api/v1/admin/session',{cache:'no-store',credentials:'same-origin'});const d=await r.json();if(d.authenticated){location.replace(next);return}if(d.email)$('email').value=d.email;if(d.two_factor_enabled)$('twofa').classList.add('show')}catch{}}$('login').onclick=async()=>{$('login').disabled=true;$('status').textContent='Signing in…';$('status').className='status';try{const r=await fetch('/api/v1/admin/session',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value,totp_code:$('totp').value.trim()||null})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Sign in failed');$('status').textContent='Access granted.';$('status').className='status ok';location.replace(next)}catch(e){$('status').textContent=e.message;$('status').className='status error'}finally{$('login').disabled=false}};document.addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});status()})();</script></body></html>
