<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PrediBeacon · Revenue reconciliation</title><style nonce="__CSP_NONCE__">:root{color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--text:#f8fafc;--muted:#aab4c3;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 2rem));margin:auto}header{padding:1rem 0;border-bottom:1px solid var(--line)}a{color:var(--accent)}main{padding:2rem 0}.login,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}.login{display:grid;grid-template-columns:1fr auto;gap:.75rem}input,button{font:inherit;min-height:44px;border-radius:9px;padding:.7rem}input{background:var(--bg);color:var(--text);border:1px solid var(--line)}button{border:0;background:var(--accent);font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem}.metric strong{display:block;font-size:1.7rem}.muted{color:var(--muted)}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:700px){.login,.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><strong>PrediBeacon revenue reconciliation</strong> · <a href="/admin/operations">Operations</a></div></header><main class="wrap"><section class="login"><input id="token" type="password" autocomplete="off" aria-label="Administrator token" placeholder="Administrator token"><button id="load" type="button">Load dashboard</button></section><p id="message" class="muted" role="status" aria-live="polite">No partner value is estimated.</p><section id="content" hidden><div class="grid"><article class="metric"><span>Records</span><strong id="records">0</strong></article><article class="metric"><span>Unpriced</span><strong id="unpriced">0</strong></article><article class="metric"><span>Audit events</span><strong id="events">0</strong></article></div><section class="panel"><h1>Known commission totals</h1><div id="totals" class="muted"></div></section><section class="panel"><h2>States</h2><div id="states" class="muted"></div></section><p id="notice" class="muted"></p></section></main><script nonce="__CSP_NONCE__">const token=document.getElementById("token"),message=document.getElementById("message"),content=document.getElementById("content");function rows(object){const dl=document.createElement("dl");Object.entries(object).forEach(([key,value])=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=key;dd.textContent=String(value);dl.append(dt,dd)});return dl}async function load(){message.textContent="Loading…";content.hidden=true;try{const response=await fetch("/api/v1/admin/revenue",{headers:{"X-MarketPulse-Admin-Token":token.value}});if(!response.ok)throw new Error(response.status===401?"Invalid administrator token":"Unable to load revenue");const data=await response.json();document.getElementById("records").textContent=data.record_count;document.getElementById("unpriced").textContent=data.unpriced_record_count;document.getElementById("events").textContent=data.audit_event_count;document.getElementById("totals").replaceChildren(rows(data.known_commission_totals));document.getElementById("states").replaceChildren(rows(data.state_counts));document.getElementById("notice").textContent=data.notice;content.hidden=false;message.textContent=data.record_count?"Dashboard loaded.":"No commercial records yet; this is the truthful pre-launch state."}catch(error){message.textContent=error.message}}document.getElementById("load").addEventListener("click",load);token.addEventListener("keydown",e=>{if(e.key==="Enter")load()});</script></body></html>
