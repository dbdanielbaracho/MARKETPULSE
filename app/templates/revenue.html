<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PrediBeacon · Revenue</title><style nonce="__CSP_NONCE__">:root{color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#273244;--text:#f8fafc;--muted:#aab4c3;--accent:#8be9c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 2rem));margin:auto}header{padding:1rem 0;border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;gap:1rem}a{color:var(--accent)}main{padding:2rem 0}.toolbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem}button{font:inherit;min-height:44px;border:0;border-radius:9px;padding:.7rem;background:var(--accent);font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem}.metric strong{display:block;font-size:1.7rem}.muted{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><strong>PrediBeacon revenue</strong><a href="/admin/dashboard">← Dashboard</a></div></header><main class="wrap"><section class="toolbar"><span>Secure administrator session</span><button id="load" type="button">Refresh</button></section><p id="message" class="muted" role="status" aria-live="polite">Loading…</p><section id="content" hidden><div class="grid"><article class="metric"><span>Records</span><strong id="records">0</strong></article><article class="metric"><span>Unpriced</span><strong id="unpriced">0</strong></article><article class="metric"><span>Audit events</span><strong id="events">0</strong></article></div><section class="panel"><h1>Known commission totals</h1><div id="totals" class="muted"></div></section><section class="panel"><h2>States</h2><div id="states" class="muted"></div></section><p id="notice" class="muted"></p></section></main><script nonce="__CSP_NONCE__">const message=document.getElementById('message'),content=document.getElementById('content');function rows(o){const dl=document.createElement('dl');Object.entries(o).forEach(([k,v])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=String(v);dl.append(dt,dd)});return dl}async function load(){message.textContent='Loading…';content.hidden=true;try{const r=await fetch('/api/v1/admin/revenue',{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.replace('/admin/login?next='+encodeURIComponent(location.pathname));return}if(!r.ok)throw new Error('Unable to load revenue');const d=await r.json();document.getElementById('records').textContent=d.record_count;document.getElementById('unpriced').textContent=d.unpriced_record_count;document.getElementById('events').textContent=d.audit_event_count;document.getElementById('totals').replaceChildren(rows(d.known_commission_totals));document.getElementById('states').replaceChildren(rows(d.state_counts));document.getElementById('notice').textContent=d.notice;content.hidden=false;message.textContent=d.record_count?'Dashboard loaded.':'No commercial records yet; this is the truthful pre-launch state.'}catch(e){message.textContent=e.message}}document.getElementById('load').onclick=load;load();</script></body></html>
